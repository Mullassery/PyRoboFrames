name: Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # The ffmpeg feature (enabled below) has a real test
        # (decode::tests::ffmpeg_decoder_decodes_a_real_frame) that shells
        # out to the actual ffmpeg binary, not a mock - it needs to be on
        # PATH for that to work.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The whole repo is a single Cargo workspace rooted here (see the
          # top-level Cargo.toml's [workspace] members). "crates"/"core"/
          # "python" as separate cache roots were wrong - "core" doesn't
          # even exist as a directory, and neither "crates" nor "python" has
          # its own independent Cargo.lock/target to cache.
          workspaces: .

      - name: Build Rust
        # Not --all-features: that unconditionally enables pyroboframes-py's
        # `extension-module` feature too, which is only meant to be combined
        # with maturin's build (its own Cargo.toml documents this) - it needs
        # maturin's dynamic-lookup linker flags and fails to link with a
        # plain `cargo build`/`cargo test`, independent of platform. `cuda`
        # is also excluded since ubuntu-latest runners have no CUDA toolkit.
        run: cargo build --release --features ffmpeg

      - name: Test Rust
        run: cargo test --release --features ffmpeg

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # pyproject.toml lives at the repo root (it points at python/pyroboframes
        # as the package dir) - `cd python` before installing looked for a
        # pyproject.toml/setup.py that was never there, so this step always
        # failed and never actually installed the package.
        run: pip install -e ".[dev]"

      - name: Run pytest
        # The real test suite lives in ./tests at the repo root, not
        # python/tests (which doesn't exist) - this condition was always
        # false, so pytest never actually ran and this step silently
        # reported success on zero real tests.
        run: if [ -d "tests" ]; then pytest tests/ -v --tb=short; else echo "No Python tests found"; fi
