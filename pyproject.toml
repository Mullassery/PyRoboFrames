[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pyroboframes"
description = "High-performance dataloader for robot learning datasets. LeRobot format support, hardware-accelerated video decode via VideoToolbox, MLX array output. Zero-copy data pipeline optimized for Apple Silicon and edge robotics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
keywords = [
    "robotics",
    "robot-learning",
    "ml-dataloader",
    "lerobot",
    "dataset-loader",
    "computer-vision",
    "video-processing",
    "mlx",
    "pytorch",
    "jax",
    "numpy",
    "data-pipeline",
    "machine-learning",
    "reinforcement-learning",
    "edge-ai",
    "apple-silicon",
    "video-decode",
    "zero-copy",
    "deep-learning",
    "neural-networks",
    "training-framework",
    "data-preprocessing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    # numpy is imported at package import (transforms.py), and the loader returns NumPy arrays;
    # pyarrow is needed to read the Parquet that `convert_mcap` writes.
    # NOTE: Removed hard pinning (numpy==1.24) to support Python 3.13+
    # Use pre-built wheels; avoid source compilation which fails due to removed distutils
    "numpy>=1.24",
    "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyRoboFrames"
Repository = "https://github.com/Mullassery/PyRoboFrames"
Documentation = "https://github.com/Mullassery/PyRoboFrames#readme"
"Bug Tracker" = "https://github.com/Mullassery/PyRoboFrames/issues"
Changelog = "https://github.com/Mullassery/PyRoboFrames/releases"
"Source Code" = "https://github.com/Mullassery/PyRoboFrames/tree/main"
Discussions = "https://github.com/Mullassery/PyRoboFrames/discussions"

[project.optional-dependencies]
mlx = ["mlx==0.20"]
# pandas is required (not just optional-import) by tests/test_storage.py's LeRobot
# hub download path (`hub.py: _download_lerobot_partial` calls `Table.to_pandas()`).
# scipy/scikit-learn power the optional GPU-acceleration and 3D occupancy morphology
# paths (gpu_acceleration.py, occupancy_3d.py).
#
# Previously capped below the numpy 1.26 threshold (numpy<1.27, pandas<2.2,
# scipy<1.13, scikit-learn<1.5) on the assumption the compiled extension needed
# numpy<1.26. That assumption was never actually true for this crate's `numpy`
# (Rust) 0.22 binding, and the runtime `numpy>=1.24` dependency above has had no
# upper bound since 2804b06. Verified: full test suite (302 passed, 0 failed) with
# numpy 2.4.6 + pyarrow 25 + scipy 1.17 + scikit-learn 1.9 + pandas 3.0.5, so the
# caps are gone. Floor stays at numpy>=1.24 only because 1.24.x lacks a cp312 wheel
# (predates Python 3.12) and would otherwise force a source build that fails
# outright (no working setuptools.build_meta) on 3.12+ — pip naturally resolves to
# a newer numpy there instead.
dev = [
    "pytest==8",
    "numpy>=1.24",
    "maturin==1.7",
    "pandas",
    "scipy",
    "scikit-learn",
    # hub.py's LeRobot-hub download path lazily imports huggingface_hub as a
    # genuinely optional runtime dependency (see hub.py) - but
    # tests/test_storage.py exercises that path, so it's needed here for a
    # `pip install -e ".[dev]"` to actually be able to run the full suite.
    "huggingface_hub>=0.21.0",
]

[tool.maturin]
manifest-path = "crates/pyroboframes-py/Cargo.toml"
module-name = "pyroboframes._core"
python-source = "python"
# `videotoolbox` (the real, in-process VTDecompressionSession hardware-decode path — see
# crates/pyroboframes-core/src/videotoolbox_native.rs) was missing here, so every wheel ever
# published to PyPI silently fell back to the `ffmpeg` CLI-subprocess decoder on macOS despite
# the videotoolbox path being real, tested code (`cargo test --features videotoolbox`) — verify
# with `otool -L` on the built .so: no CoreMedia/CoreVideo/VideoToolbox frameworks were linked
# before this. Safe to always include: the underlying `videotoolbox`/`apple-cf` crates are
# declared under Cargo.toml's `[target.'cfg(target_os = "macos")'.dependencies]`, so this is a
# no-op on non-macOS source builds.
features = ["pyo3/extension-module", "ffmpeg", "videotoolbox"]
include = ["LICENSE"]
